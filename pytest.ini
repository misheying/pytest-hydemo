# =====================================================================
# pytest.ini —— pytest 的配置文件
# =====================================================================
# 作用：放在项目根目录，pytest 启动时会自动读取，按下面的规则来运行测试。
# 运行方式：在项目根目录执行  pytest   （或  uv run pytest）
#
# 说明：下面的键名必须用英文，值可以按需修改；每段都有中文注释讲解。

[pytest]

# -------------------------------------------------------------------
# 1) pythonpath：把指定目录加入 Python 的模块搜索路径（sys.path）
# -------------------------------------------------------------------
# 本项目测试文件里写的是：
#     from src.apiclient import AIPClient
#     from data.course_data import ...
# 这要求「项目根目录」在 sys.path 里，Python 才能找到 src 和 data 这两个包。
# 如果不加这一行，直接运行 pytest 会报：
#     ModuleNotFoundError: No module named 'src'
# （提示：pythonpath 需要 pytest 7.0+，本项目用的是 9.x，没问题）
pythonpath = .

# -------------------------------------------------------------------
# 2) testpaths：测试文件所在的目录
# -------------------------------------------------------------------
# 告诉 pytest 去哪个目录里找测试用例，这里指定 tests 目录。
testpaths = tests

# -------------------------------------------------------------------
# 3) python_files：什么样的「文件名」会被当成测试文件
# -------------------------------------------------------------------
# 默认规则是 test_*.py 和 *_test.py，但本项目文件命名不统一，所以放宽成：
#   test*.py   -> 只要 test 开头都算（如 test001.py、tests_login.py、test_course_data_driven.py）
#   *_test.py  -> 以 _test 结尾也算（这是常规约定，留着备用）
# 注意：tset003.py（拼写笔误）不会被匹配——它是个独立演示脚本，本来也不该被当测试收集。
python_files = test*.py *_test.py

# -------------------------------------------------------------------
# 4) python_classes：什么样的「类」会被当成测试类
# -------------------------------------------------------------------
# 类名以 Test 开头的类，里面的用例才会被执行（如 TestLogin、TestCourseAdd）。
python_classes = Test*

# -------------------------------------------------------------------
# 5) python_functions：什么样的「函数/方法」会被当成测试用例
# -------------------------------------------------------------------
# 名字以 test_ 开头的函数/方法，才会被当成一条测试用例执行。
python_functions = test_*

# -------------------------------------------------------------------
# 6) addopts：每次运行 pytest 时默认追加的命令行参数
# -------------------------------------------------------------------
#   -v : 详细模式，显示每条用例的名字和 PASSED / FAILED
#   -s : 关闭输出捕获，让用例里的 print 直接打印到控制台（教学时想看 print 就保留它）
# 如果不想看 print 输出，把 -s 去掉即可。
addopts = -v --tb=short -s

# -------------------------------------------------------------------
# 7) markers：注册自定义标记（给用例打标签，方便按标记筛选运行）
# -------------------------------------------------------------------
# 用 @pytest.mark.xxx 给用例打标签后，要在这里注册，否则 pytest 会报警告。
# 运行方式：pytest -m smoke   （只跑打了 smoke 标记的用例）
markers =
    smoke: 冒烟测试（核心功能）
    regression: 回归测试
    login: 登录相关测试
    course: 课程管理测试
    contract: 合同管理测试
