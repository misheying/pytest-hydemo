name: Pytest CI

# 触发条件：push 或 PR 到 main/master 时自动运行
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 赋予写权限（部署 GitHub Pages 需要）
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 缓存 pip 依赖，第二次运行会快很多
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 3. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. 安装 Java（allure 命令行工具需要 Java）
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 5. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest allure-pytest

      # 6. 运行测试，生成 allure 结果数据
      - name: Run tests
        run: pytest --alluredir=./allure-results

      # 7. 安装 allure 命令行工具 + 生成 HTML 报告
      - name: Generate Allure Report
        if: always()
        run: |
          curl -L -o allure.tgz https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/2.46.1/allure-commandline-2.46.1.tgz
          mkdir -p allure-cli
          tar -xzf allure.tgz -C allure-cli --strip-components=1
          echo "$PWD/allure-cli/bin" >> "$GITHUB_PATH"
          allure generate ./allure-results -o ./allure-report --clean

      # 8. 上传 HTML 报告（测试失败也上传，方便排查）
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      # 9. 部署报告到 GitHub Pages（生成在线报告网址，团队都能访问）
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      # 10. 测试失败时发送邮件通知
      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "测试失败：${{ github.repository }}"
          to: 15982870455@163.com
          from: GitHub Actions
          body: "请查看：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
