name: Pytest CI

# 触发条件：push 或 PR 到 main/master 时自动运行
on:
  name: Pytest CI

  on: [ push ]
  # 加入这两行，赋予写权限
  permissions:
    contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 第1步：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第2步：安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 第3步：安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest allure-pytest

      # 第4步：运行测试，生成 allure 结果数据
      - name: Run tests
        run: pytest --alluredir=./allure-results

      # 第5步：安装 allure 命令行工具（生成 HTML 报告需要它）
      - name: Install Allure CLI
        if: always()
        run: |
          curl -L -o allure.tgz https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/2.46.1/allure-commandline-2.46.1.tgz
          mkdir -p allure-cli
          tar -xzf allure.tgz -C allure-cli --strip-components=1
          echo "$PWD/allure-cli/bin" >> "$GITHUB_PATH"

      # 第6步：把 allure-results 数据转成 HTML 网页报告
      - name: Generate Allure Report
        if: always()
        run: allure generate ./allure-results -o ./allure-report --clean

      # 第7步：上传 HTML 报告（测试失败也上传，方便排查）
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      # 加入邮件通知
      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com # 👈 改成你邮箱 的服务器
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "测试失败：${{ github.repository }}"
          to: 15982870455@163.com # 👈 改成了你真实的接收邮箱
          from: GitHub Actions
          body: "请查看：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      #缓存依赖，加快运行，第二次运行时会快 30%~50%
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      #生成 Allure 在线报告（部署到 GitHub Pages）
      - name: Generate Allure report
        if: always()
        run: |
          # 需要先安装 allure 命令行
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -zxvf allure-2.30.0.tgz
          ./allure-2.30.0/bin/allure generate ./allure-results -o ./allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
      #效果 每次 push 后，报告自动发布到一个网址，团队所有人都能访问